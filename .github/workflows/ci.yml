name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Validation commands and the local bridge run inside bubblewrap sandboxes,
      # so the sandbox must work before any test step.
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      # ubuntu-24.04 blocks unprivileged user namespaces through AppArmor, which
      # makes bwrap fail. The key is absent on kernels without that restriction.
      - name: Allow unprivileged user namespaces
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "kernel.apparmor_restrict_unprivileged_userns is not present; nothing to relax"
          fi

      - name: Smoke-test bubblewrap
        run: bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid true

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Bridge tests
        run: pnpm test:bridge
        timeout-minutes: 8

      - name: Build
        run: pnpm build
